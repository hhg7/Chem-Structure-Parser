name             = Chem-Structure-Parser
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2026-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = MakeMaker
-remove = GatherDir

[Git::GatherDir]
exclude_filename = Makefile.PL

[PruneFiles]
match = ^(?!lib/|t/|Parser\.xs$|ppport\.h$|README(\.md)?$|CONTRIBUTING\.md$|SECURITY\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[MakeMaker::Awesome]
eumm_version = 6.52
header = use Config;
header = use File::Temp ();
header = use File::Spec;
header = my $std = ($Config{gccversion} || $Config{cc} =~ /\b(?:g?cc|clang)\b/) ? ' -std=gnu99' : '';
; Parser.xs wants the `l' suffixed libm functions on a long-double perl so that
; an NV is not silently computed at double precision; they are C99 but not
; universally present, so the set is link-tested as a unit and the module falls
; back to the double functions where it is not.  Kept in step with the nv_*
; macros in Parser.xs and with the checked-in Makefile.PL, which mirrors this.
header = my $define = '';
header = if ($Config{nvtype} eq 'long double') {
header = 	my $src = "#include <math.h>\n"
header = 	        . "int main(void) { long double x = 1.0L;\n"
header = 	        . "  volatile long double r = fabsl(x) + sqrtl(x) + acosl(x) + cosl(x) + sinl(x)\n"
header = 	        . "    + atan2l(x, x);\n"
header = 	        . "  return (int)r * 0; }\n";
header = 	my $dir = File::Temp::tempdir(CLEANUP => 1);
header = 	my $c   = File::Spec->catfile($dir, 'ldmath.c');
header = 	my $bin = File::Spec->catfile($dir, 'ldmath');
header = 	if (open my $fh, '>', $c) {
header = 		print {$fh} $src;
header = 		close $fh;
header = 		my $quiet = File::Spec->devnull;
header = 		$define = '-DCSP_HAVE_LONG_DOUBLE_MATH'
header = 			if system("$Config{cc}$std -o $bin $c -lm > $quiet 2> $quiet") == 0;
header = 	}
header = 	warn "Chem::Structure::Parser: this libm is missing some long double math\n"
header = 	   . "  functions; the feature calculations fall back to double precision.\n"
header = 		unless $define;
header = }
; MakeMaker's directory scan treats a top-level *.pl and *.pod as modules to
; install, so the author-only helpers in the root (test.all.perls.pl,
; structure.info.pl, benchmark.pl, and md2pod.pl's read.me.pod) were copied into
; $(INST_LIB)/Chem/Structure/ by `make install`.  libscan is the documented hook
; for rejecting them.  Kept in step with the checked-in Makefile.PL, which
; mirrors this header.
header = {
header = 	package MY;
header = 	sub libscan {
header = 		my ($self, $path) = @_;
header = 		return '' if $path =~ /\.(?:pl|pod)\z/ && $path !~ m{/};
header = 		return $self->SUPER::libscan($path);
header = 	}
header = }
WriteMakefile_arg = CCFLAGS => $Config::Config{ccflags} . $std
WriteMakefile_arg = DEFINE => $define
WriteMakefile_arg = LIBS => ['-lm']

[VersionFromModule]
[MetaJSON]
[MetaProvides::Package]
meta_noindex = 1

; What lib/Chem/Structure/Parser.pm itself loads.  "autodie" used to be here and
; is gone: it was a prerequisite on every installer's machine for five calls,
; which the module now checks by hand, in autodie's own words.
[Prereqs]
perl            = 5.010
Exporter        = 0
Scalar::Util    = 0
XSLoader        = 0

; What t/*.t loads and the module does not.  A phaseless [Prereqs] block is the
; runtime phase, so these two spent 0.01 through 0.03 in runtime.requires and
; every installer of the module was asked for Test::Exception.  Kept in step
; with TEST_REQUIRES in the checked-in Makefile.PL.
[Prereqs / TestRequires]
Test::More      = 0
Test::Exception = 0

[MetaResources]
repository.web  = https://github.com/hhg7/Chem-Structure-Parser
repository.url  = https://github.com/hhg7/Chem-Structure-Parser.git
repository.type = git
bugtracker.web  = https://github.com/hhg7/Chem-Structure-Parser/issues
