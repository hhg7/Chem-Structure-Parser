name             = Chem-Structure-Parser
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2026-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = MakeMaker
-remove = GatherDir

[Git::GatherDir]
exclude_filename = Makefile.PL

[PruneFiles]
match = ^(?!lib/|t/|Parser\.xs$|ppport\.h$|README(\.md)?$|CONTRIBUTING\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[MakeMaker::Awesome]
eumm_version = 6.52
header = use Config;
header = my $std = ($Config{gccversion} || $Config{cc} =~ /\b(?:g?cc|clang)\b/) ? ' -std=gnu99' : '';
; MakeMaker's directory scan treats a top-level *.pl as a module to install, so
; the author-only helpers in the root (test.all.perls.pl, structure.info.pl,
; benchmark.pl) were copied into $(INST_LIB)/Chem/Structure/ by `make install`.
; libscan is the documented hook for rejecting them.  Kept in step with the
; checked-in Makefile.PL, which mirrors this header.
header = {
header = 	package MY;
header = 	sub libscan {
header = 		my ($self, $path) = @_;
header = 		return '' if $path =~ /\.pl\z/ && $path !~ m{/};
header = 		return $self->SUPER::libscan($path);
header = 	}
header = }
WriteMakefile_arg = CCFLAGS => $Config::Config{ccflags} . $std

[VersionFromModule]
[MetaJSON]
[MetaProvides::Package]
meta_noindex = 1

[Prereqs]
perl            = 5.010
autodie         = 0
Exporter        = 0
Scalar::Util    = 0
XSLoader        = 0
Test::More      = 0
Test::Exception = 0

[MetaResources]
repository.web  = https://github.com/hhg7/Chem-Structure-Parser
repository.url  = https://github.com/hhg7/Chem-Structure-Parser.git
repository.type = git
bugtracker.web  = https://github.com/hhg7/Chem-Structure-Parser/issues
